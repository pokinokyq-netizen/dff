
name: Build Bee EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Bee
        shell: cmd
        run: cl /nologo /EHsc /O2 /utf-8 main.cpp /link user32.lib gdi32.lib /SUBSYSTEM:WINDOWS /OUT:Bee.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Bee-Windows
          path: Bee.exe
